<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>IqraZone – জ্ঞানের আলোয় আলোকিত জীবন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fc;--card:#ffffff;--ink:#1c2740;--mut:#62708c;--gold:#2f5bd8;--gold2:#2449b8;--glow:#2f5bd824;--hero:#2f5bd814;
--surf:#eef3fc;--surf2:#ffffff;--line:#e4e9f3;--line2:#d4dcec;--ga:#ffffff;--gb:#f2f6fe;
--ring:#2f5bd855;--tint:#2f5bd814;--ongold:#ffffff;--side:#ffffff;--dlg:#ffffff;--mapf:none}
:root{--font:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;--sw:240px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;font-size:13px}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.45;font-size:1rem;transition:background-color .3s,color .3s}
body.collapsed{--sw:80px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
svg{fill:none;stroke:var(--gold2);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ===== ২. লেআউট: বাম সাইডবার + ডান কন্টেন্ট ===== */
.shell{display:grid;grid-template-columns:var(--sw) 1fr;min-height:100vh;transition:grid-template-columns .25s}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line2);z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:12px 12px 8px;cursor:pointer;background:none;border:0;text-align:left}
.logo{width:36px;height:36px;flex:none;border-radius:14px;border:2px solid var(--gold);display:grid;place-items:center;background:var(--surf);box-shadow:0 0 12px var(--glow)}
.logo svg{width:20px;height:20px}
.brand b{font-size:1.3rem;line-height:1.1;display:block}
.brand small{font-size:.72rem;color:var(--mut);font-weight:400;display:block}
.sb{flex:1;overflow-y:auto;padding:4px 8px 8px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.gl{font-size:.72rem;letter-spacing:.04em;color:var(--mut);padding:10px 10px 3px;text-transform:uppercase}
.item{display:flex;align-items:center;gap:8px;border-radius:14px;margin-bottom:0}
.item>button.row{flex:1;display:flex;align-items:center;gap:9px;min-width:0;background:none;border:0;padding:6px 10px;border-radius:10px;text-align:left;color:var(--mut)}
.item svg{width:17px;height:17px;flex:none;stroke:currentColor}
.item .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.item:hover>button.row{background:var(--surf);color:var(--ink)}
.item.on>button.row{background:var(--tint);color:var(--gold2);font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.chev{width:24px;height:24px;flex:none;border:0;background:none;display:grid;place-items:center;border-radius:10px;color:var(--mut)}
.chev:hover{background:var(--surf)}
.chev svg{width:13px;height:13px;transition:transform .2s}
.item.open .chev svg{transform:rotate(90deg)}
.sub{margin:0 0 4px 18px;padding-left:8px;border-left:1px dashed var(--line2)}
.sub button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:4px 8px;border-radius:10px;color:var(--mut);font-size:.88rem;text-align:left}
.sub button:hover{background:var(--surf);color:var(--ink)}
.sub svg{width:14px;height:14px;stroke:currentColor;flex:none}
.sbf{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line)}
.sbf button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:7px;border-radius:10px;border:1px solid var(--line2);background:var(--surf);font-size:.88rem}
.sbf svg{width:18px;height:18px}
.coll-btn svg{transition:transform .25s}
body.collapsed .coll-btn svg{transform:rotate(180deg)}

/* কলাপ্স মোড (শুধু ডেস্কটপ) */
@media(min-width:901px){
 body.collapsed .brand div,body.collapsed .lbl,body.collapsed .chev,body.collapsed .sub,body.collapsed .gl,body.collapsed .sbf .t{display:none}
 body.collapsed .item>button.row{justify-content:center;padding:12px}
 body.collapsed .gl{display:block;height:1px;padding:0;margin:10px 14px;background:var(--line);font-size:0}
 body.collapsed .brand{justify-content:center;padding-inline:0}
 body.collapsed .sbf{flex-direction:column}
}

/* ===== ৩. টপ বার ===== */
main{min-width:0;padding:0 20px 40px;background-image:radial-gradient(circle at 90% -5%,var(--hero),transparent 40%);background-repeat:no-repeat}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 0;background:linear-gradient(var(--bg) 70%,transparent);backdrop-filter:blur(6px)}
.ham{display:none;width:38px;height:38px;border-radius:14px;border:1px solid var(--line2);background:var(--surf);place-items:center;flex:none}
.ham svg{width:22px;height:22px}
.sbox{flex:1;position:relative;max-width:520px}
.sbox svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:17px;height:17px}
#q{width:100%;padding:7px 14px 7px 38px;border-radius:12px;border:1px solid var(--line2);background:var(--surf2);color:var(--ink);font:inherit}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line2);background:var(--surf);display:grid;place-items:center}
.ibtn svg{width:22px;height:22px}

/* ===== ৪. হোম ===== */
.hello{margin:2px 0 10px}
.hello p{color:var(--mut)}
.hello h2{font-size:1.3rem;font-weight:600;line-height:1.3}
.hello .dt{font-size:.9rem;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:9px 12px}
.stat .ic{width:34px;height:34px;border-radius:10px}
.stat b{font-size:1.25rem;line-height:1;display:block}
.stat small{color:var(--mut);font-size:.8rem}
.ic{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:12px;border:1.5px solid var(--gold);background:var(--tint);box-shadow:0 0 12px var(--glow)}
.ic svg{width:48%;height:48%}
.ic.big{width:54px;height:54px;border-radius:16px;border-width:2px}
.card{border:1.5px solid var(--gold);border-radius:16px;background:linear-gradient(180deg,var(--ga),var(--gb));padding:11px 16px;box-shadow:0 0 22px var(--glow)}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;color:var(--mut);font-size:.9rem}
.qt{font-size:1.05rem;line-height:1.5}
.qt cite{display:block;margin-top:2px;color:var(--gold);font-size:.85rem;font-style:normal}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}
.sh h2{font-size:1.15rem;font-weight:600}
.sh span{color:var(--mut);font-size:.9rem}

/* ক্যাটাগরি কার্ড */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;transition:transform .2s,box-shadow .2s,border-color .2s}
.cc:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 26px var(--glow)}
.cc .h{display:flex;align-items:center;gap:9px}
.cc b{display:block;font-size:.98rem;line-height:1.3}
.cc small{color:var(--mut);font-size:.78rem}
.cc .tags{display:flex;flex-wrap:wrap;gap:4px}
.cc .tags i{font-style:normal;font-size:.74rem;padding:0 8px;border-radius:999px;background:var(--surf);border:1px solid var(--line2);color:var(--mut)}
.cc .cnt{margin-top:auto;font-size:.8rem;color:var(--gold2)}

/* ===== ৫. ভেতরের পাতা ===== */
.crumb{color:var(--mut);font-size:.85rem;margin:2px 0 0}
.crumb a{color:var(--gold2);cursor:pointer}
.ph{display:flex;align-items:center;gap:12px;margin:8px 0 10px}
.ph h2{font-size:1.5rem;line-height:1.2}.ph small{color:var(--mut)}
.quote{position:relative;border:1.5px solid var(--gold);border-radius:16px;padding:10px 14px 9px 44px;background:var(--surf2);box-shadow:0 0 18px var(--glow);margin-bottom:6px}
.quote::before{content:"“";position:absolute;left:12px;top:-4px;font-size:3rem;color:var(--gold);line-height:1}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tc{display:flex;align-items:center;gap:9px;text-align:left;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:7px 10px;transition:.2s}
.tc:hover{border-color:var(--gold);background:var(--tint);transform:translateY(-2px)}
.tc .ic{width:32px;height:32px;border-radius:10px;box-shadow:none}
.tc b{display:block;font-size:.95rem;font-weight:500;line-height:1.3}
.tc small{color:var(--mut);font-size:.76rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--ring);background:var(--surf2);padding:3px 11px;border-radius:999px;font-size:.88rem}
.chip.on,.chip.ok{background:var(--gold);color:var(--ongold);border-color:var(--gold)}.chip.no{background:#a93a32;color:#fff;border-color:#a93a32}
iframe{width:100%;height:min(52vh,400px);border:2px solid var(--gold);border-radius:22px;box-shadow:0 0 18px var(--glow);filter:var(--mapf)}
.qz{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.q{border:1px solid var(--line2);border-radius:12px;padding:9px 11px;background:var(--card)}
.q div{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.moreq{margin-top:8px}.moreq .quote{margin-top:8px}
.empty{color:var(--mut);padding:30px 0;text-align:center}

/* ===== ৬. পপআপ ও থিম ===== */
dialog{background:var(--dlg);color:var(--ink);border:2px solid var(--gold);border-radius:26px;width:calc(100% - 32px);max-width:420px;padding:22px;margin:auto;box-shadow:0 0 40px var(--glow)}
dialog::backdrop{background:#000c}
dialog .ic{margin:0 auto 12px}
dialog h3{text-align:center}dialog p{color:var(--mut);margin:10px 0;text-align:center}
dialog ul{margin:10px 0 10px 20px}dialog a{color:var(--gold2)}
.cl{display:block;margin:14px auto 0}
.ov{display:none}

/* ===== ৭. মোবাইল ===== */
@media(max-width:900px){
 .shell{grid-template-columns:1fr}
 aside{position:fixed;left:0;top:0;width:min(86vw,320px);transform:translateX(-102%);transition:transform .25s;box-shadow:0 0 40px #0009}
 body.menu aside{transform:none}
 body.menu .ov{display:block;position:fixed;inset:0;background:#0008;z-index:25}
 .ham{display:grid}
 main{padding:0 16px 40px}
 .stats{grid-template-columns:repeat(2,1fr)}
 .coll-btn{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
 <aside id="side" aria-label="প্রধান মেনু">
  <button class="brand" data-go=""><span class="logo" id="logo"></span><div><b>IqraZone</b><small>জ্ঞানের আলোয় আলোকিত জীবন</small></div></button>
  <nav class="sb" id="sb"></nav>
  <div class="sbf">
   <button class="coll-btn" data-coll aria-label="সাইডবার ছোট/বড় করুন"><span id="ico-coll"></span><span class="t">ছোট করুন</span></button>
  </div>
 </aside>
 <div class="ov" data-menu-close></div>
 <main>
  <div class="topbar">
   <button class="ham" data-menu aria-label="মেনু খুলুন" id="ham"></button>
   <div class="sbox"><span id="ico-s"></span><input id="q" type="search" placeholder="খুঁজুন: কুরআন, বিসিএস, ব্যাকরণ…" aria-label="সার্চ"></div>
  </div>
  <div id="view"></div>
 </main>
</div>
<dialog id="m"></dialog>

<script>
/* =====================================================================

const svg=(n,s)=>`<svg viewBox="0 0 24 24"${s?` width="${s}" height="${s}"`:''}><path d="${I[n]}"/></svg>`;

/* =====================================================================
   ৩. মূল ডেটা – পুরো সাইটের কন্টেন্ট এখানে
   বিভাগ:  id | bn | en | ic | q:[ফিচার্ড কোটেশন, উৎস] | m:[[কোটেশন, উৎস],...] | s:'map'/'quiz' (ঐচ্ছিক)
   টপিক:  [বাংলা নাম, English, আইকন, links(ঐচ্ছিক)]
   links উদাহরণ:  ['আল-কুরআন','Al-Quran','quran',[{t:'সূরা ফাতিহা নোট',u:'https://...'}]]
   নতুন বিভাগ যোগ করলে নিচের GROUPS-এও id বসান। সাইডবার ও হোম আপনাআপনি আপডেট হবে।
   ===================================================================== */
const C=[

 {q:'বাংলাদেশের জাতীয় ফুল কোনটি?',o:['গোলাপ','শাপলা','বেলি','কদম'],a:1},
 {q:'বাংলাদেশের স্বাধীনতা দিবস কবে?',o:['১৬ ডিসেম্বর','২১ ফেব্রুয়ারি','২৬ মার্চ','১৭ এপ্রিল'],a:2},
 {q:'পৃথিবীর বৃহত্তম মহাসাগর কোনটি?',o:['আটলান্টিক','প্রশান্ত','ভারত','আর্কটিক'],a:1},
 {q:'কুরআনের প্রথম নাজিলকৃত আয়াত কোন সূরার?',o:['ফাতিহা','বাকারা','আলাক','ইখলাস'],a:2},
 {q:'বাংলাদেশের রাজধানী কোনটি?',o:['চট্টগ্রাম','ঢাকা','খুলনা','সিলেট'],a:1},
 {q:'সূর্য কী?',o:['গ্রহ','তারা','উপগ্রহ','ধূমকেতু'],a:1},
 {q:'পানির রাসায়নিক সংকেত কোনটি?',o:['CO₂','H₂O','O₂','NaCl'],a:1},
 {q:'বিশ্বের সবচেয়ে বড় মহাদেশ কোনটি?',o:['আফ্রিকা','ইউরোপ','এশিয়া','উত্তর আমেরিকা'],a:2},
 {q:'রমজান হিজরি সনের কততম মাস?',o:['৭ম','৮ম','৯ম','১০ম'],a:2},
 {q:'বাংলাদেশের জাতীয় কবি কে?',o:['রবীন্দ্রনাথ ঠাকুর','কাজী নজরুল ইসলাম','জসীমউদ্দীন','জীবনানন্দ দাশ'],a:1},
 {q:'সূরা ফাতিহার আয়াত সংখ্যা কত?',o:['৫','৭','৯','১১'],a:1},
 {q:'বাংলাদেশের জাতীয় পশু কোনটি?',o:['হরিণ','রয়েল বেঙ্গল টাইগার','হাতি','ভালুক'],a:1}];

/* ম্যাপ অঞ্চল: [নাম, bbox = পশ্চিম,দক্ষিণ,পূর্ব,উত্তর] */
const REG=[['বাংলাদেশ','88.0,20.5,92.7,26.7'],['ঢাকা','89.6,23.2,91.0,24.6'],['চট্টগ্রাম','90.9,21.2,92.4,23.4'],['রাজশাহী','88.0,24.0,89.6,25.5'],['খুলনা','88.8,21.7,90.0,23.4'],['বরিশাল','89.9,21.8,91.0,23.1'],['সিলেট','91.2,24.0,92.4,25.2'],['রংপুর','88.4,25.0,89.8,26.7'],['ময়মনসিংহ','89.8,24.2,91.0,25.4'],['বিশ্ব','-170,-55,180,75']];
const mapSrc=b=>`https://www.openstreetmap.org/export/embed.html?bbox=${b}&layer=mapnik`;

/* =====================================================================
   ৪. রেন্ডার লজিক
   ===================================================================== */
const $=s=>document.querySelector(s),view=$('#view'),sb=$('#sb'),byId=id=>C.find(c=>c.id===id);
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const cur=()=>location.hash.slice(1);
const open=new Set();   // সাইডবারে কোন বিভাগ খোলা

/* স্থির আইকনগুলো */
$('#logo').innerHTML=svg('quran');$('#ico-s').innerHTML=svg('search');
$('#ham').innerHTML=svg('menu');$('#ico-coll').innerHTML=svg('chevL');

/* ---------- সাইডবার ---------- */
function sidebar(){
  const a=cur(),keep=sb.scrollTop;
  let h=`<div class="item ${!a?'on':''}"><button class="row" data-go="" title="হোম">${svg('home')}<span class="lbl">হোম</span></button></div>`;
  GROUPS.forEach(g=>{
    h+=`<div class="gl">${g[0]}</div>`;
    g[2].forEach(id=>{
      const c=byId(id),isOn=a===id,isOpen=open.has(id)||isOn;
      h+=`<div class="item ${isOn?'on':''} ${isOpen?'open':''}"><button class="row" data-go="${id}" title="${c.bn}">${svg(c.ic)}<span class="lbl">${c.bn}</span></button>
      <button class="chev" data-x="${id}" aria-label="টপিক দেখান/লুকান" aria-expanded="${isOpen}">${svg('chevR')}</button></div>`;
      if(isOpen)h+=`<div class="sub">${c.t.map((t,i)=>`<button data-t="${id},${i}">${svg(t[2])}<span>${t[0]}</span></button>`).join('')}</div>`;
    });
  });
  sb.innerHTML=h;sb.scrollTop=keep;
}

/* ---------- কার্ড ও কোটেশন ---------- */
const quoteBox=x=>`<div class="quote"><p class="qt">${x[0]}<cite>— ${x[1]}</cite></p></div>`;
const topCard=(c,i)=>{const t=c.t[i];return `<button class="tc" data-t="${c.id},${i}"><span class="ic">${svg(t[2])}</span><span><b>${t[0]}</b><small>${t[1]}</small></span></button>`};
const catCard=c=>`<button class="cc" data-go="${c.id}"><span class="h"><span class="ic">${svg(c.ic)}</span><span><b>${c.bn}</b><small>${c.en}</small></span></span>
  <span class="tags">${c.t.slice(0,3).map(t=>`<i>${t[0]}</i>`).join('')}${c.t.length>3?`<i>+${bn(c.t.length-3)}</i>`:''}</span>
  <span class="cnt">${bn(c.t.length)}টি টপিক →</span></button>`;
const sh=(a,b)=>`<div class="sh"><h2>${a}</h2><span>${b||''}</span></div>`;

/* ---------- হোম ---------- */
function home(){
  const dq=C[new Date().getDate()%C.length].q,topics=C.reduce((n,c)=>n+c.t.length,0);
  const stat=(ic,n,l)=>`<div class="stat"><span class="ic">${svg(ic)}</span><div><b>${bn(n)}</b><small>${l}</small></div></div>`;
  view.innerHTML=`<div class="hello"><p>আসসালামু আলাইকুম</p><h2>আজ কী শিখতে চান?</h2></div>
   <div class="stats">${stat('layers',C.length,'বিভাগ')}${stat('book',topics,'টপিক')}${stat('check',QUIZ.length,'কুইজ প্রশ্ন')}${stat('map',REG.length,'ম্যাপ অঞ্চল')}</div>
   <div class="card"><div class="row"><span>আজকের অনুপ্রেরণা</span></div><p class="qt">${dq[0]}<cite>— ${dq[1]}</cite></p></div>
   ${GROUPS.map(g=>sh(g[0],g[1])+`<div class="cg">${g[2].map(id=>catCard(byId(id))).join('')}</div>`).join('')}`;
}

/* ---------- বিভাগের পাতা ---------- */
function page(c){
  let x='';
  if(c.s==='map')x=sh('ইন্টারেক্টিভ ম্যাপ','Map')+`<div class="chips">${REG.map((r,i)=>`<button class="chip ${i?'':'on'}" data-b="${r[1]}">${r[0]}</button>`).join('')}</div><iframe id="mf" title="ম্যাপ" loading="lazy" src="${mapSrc(REG[0][1])}"></iframe>`;
  if(c.s==='quiz')x=sh('দ্রুত কুইজ','Quick Quiz')+`<div class="qz">`+QUIZ.map((z,i)=>`<div class="q"><b>${z.q}</b><div>${z.o.map((o,j)=>`<button class="chip" data-q="${i}" data-j="${j}">${o}</button>`).join('')}</div></div>`).join('')+`</div>`;
  const more=c.m&&c.m.length?`<div class="moreq"><button class="chip" id="mb">আরও কোটেশন দেখুন (${bn(c.m.length)})</button><div id="mq" hidden>${c.m.map(quoteBox).join('')}</div></div>`:'';
  view.innerHTML=`<p class="crumb"><a data-go="">হোম</a> › ${c.bn}</p>
   <div class="ph"><span class="ic big">${svg(c.ic)}</span><div><h2>${c.bn}</h2><small>${c.en}</small></div></div>
   ${quoteBox(c.q)}${more}
   ${sh('সব টপিক',bn(c.t.length)+'টি')}<div class="tg">${c.t.map((_,i)=>topCard(c,i)).join('')}</div>${x}`;
  const mb=$('#mb');if(mb)mb.onclick=()=>{const q=$('#mq');q.hidden=!q.hidden;mb.textContent=q.hidden?`আরও কোটেশন দেখুন (${bn(c.m.length)})`:'কম দেখুন'};
  view.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{view.querySelectorAll('[data-b]').forEach(y=>y.classList.remove('on'));b.classList.add('on');$('#mf').src=mapSrc(b.dataset.b)});
  view.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    const z=QUIZ[b.dataset.q],p=b.parentElement;p.querySelectorAll('.chip').forEach(y=>y.classList.remove('ok','no'));
    const ok=+b.dataset.j===z.a;b.classList.add(ok?'ok':'no');if(!ok)p.children[z.a].classList.add('ok')});
}

/* ---------- সার্চ রেজাল্ট ---------- */
function results(f){
  let cats='',tops='';
  C.forEach(c=>{
    if((c.bn+c.en).toLowerCase().includes(f))cats+=catCard(c);
    c.t.forEach((t,i)=>{if((t[0]+t[1]).toLowerCase().includes(f))tops+=`<div>${topCard(c,i).replace('</span></button>',`</span></button>`)}<small style="color:var(--mut);padding-left:6px">${c.bn}</small></div>`})});
  view.innerHTML=(cats||tops)?(cats?sh('বিভাগ')+`<div class="cg">${cats}</div>`:'')+(tops?sh('টপিক')+`<div class="tg">${tops}</div>`:''):'<p class="empty">কিছু পাওয়া যায়নি। অন্য শব্দ দিয়ে খুঁজুন।</p>';
}

/* ---------- টপিকের পপআপ ---------- */
function openTopic(id,i){
  const c=byId(id),t=c.t[i],m=$('#m');
  m.innerHTML=`<span class="ic big">${svg(t[2])}</span><h3>${t[0]}</h3><p>${t[1]} · ${c.bn}</p>
  ${t[3]?`<ul>${t[3].map(l=>`<li><a href="${l.u}" target="_blank" rel="noopener">${l.t}</a></li>`).join('')}</ul>`:'<p>এই টপিকের নোট শীঘ্রই যোগ হবে।</p>'}
  <p class="qt" style="font-size:.95rem">${c.q[0]}</p><button class="chip on cl" onclick="$('#m').close()">বন্ধ করুন</button>`;
  m.showModal();
}

/* ---------- ক্লিক হ্যান্ডলার ও রাউটার ---------- */
const closeMenu=()=>document.body.classList.remove('menu');
document.addEventListener('click',e=>{
  const T=s=>e.target.closest(s);
  if(T('[data-menu]')){document.body.classList.add('menu');return}
  if(T('[data-menu-close]')){closeMenu();return}
  if(T('[data-coll]')){const b=document.body;b.classList.toggle('collapsed');try{localStorage.setItem('iz-coll',b.classList.contains('collapsed')?1:'')}catch(x){}return}
  const x=T('[data-x]');if(x){const id=x.dataset.x;open.has(id)?open.delete(id):open.add(id);if(cur()===id&&!open.has(id)){/* সক্রিয় বিভাগ বন্ধ করলে মনে রাখা হয় না */}sidebar();return}
  const t=T('[data-t]');if(t){const[a,b]=t.dataset.t.split(',');closeMenu();openTopic(a,+b);return}
  const g=T('[data-go]');if(g){const q=$('#q');q.value='';const id=g.dataset.go;if(id)open.add(id);closeMenu();
    if(cur()===id)route();else location.hash=id}
});
$('#q').oninput=e=>{const f=e.target.value.trim().toLowerCase();f?results(f):route()};

function route(){
  const c=C.find(x=>x.id===cur());
  $('#q').value='';
  c?page(c):home();
  sidebar();scrollTo(0,0);
}
addEventListener('hashchange',route);
try{if(localStorage.getItem('iz-coll'))document.body.classList.add('collapsed')}catch(e){}
route();
</script>
</body>
</html>
