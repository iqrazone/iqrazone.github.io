<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<title>IqraZone – জ্ঞানের আলোয় আলোকিত জীবন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== ১. থিম (প্রতিটি থিমের রঙ এখানে; নতুন থিম যোগ করতে একটি [data-theme=নাম] ব্লক কপি করুন) ===== */
:root,[data-theme=gold]{--bg:#0b0b0a;--card:#131312;--ink:#f4ecd8;--mut:#a79e89;--gold:#d4a22a;--gold2:#f1cf74;--glow:#d4a22a40;--hero:#d4a22a26;
--surf:#1a1914;--surf2:#15140f;--line:#2c2a22;--line2:#3a3526;--ga:#171612;--gb:#0f0f0e;--tia:#1c1b16;--tib:#0d0d0c;--tin:#0d0d0c;
--ring:#d4a22a66;--tint:#d4a22a2e;--ongold:#17120a;--navbg:#121210f2;--dlg:#12120f;--mapf:invert(.92) hue-rotate(180deg) saturate(.7)}
[data-theme=emerald]{--bg:#06130e;--card:#0c1e16;--ink:#e6f4ea;--mut:#8fb09d;--gold:#34c38f;--gold2:#8be9c0;--glow:#34c38f40;--hero:#34c38f22;
--surf:#10231a;--surf2:#0c1c14;--line:#1d3a2c;--line2:#25503b;--ga:#0f2419;--gb:#08150e;--tia:#12281d;--tib:#07130d;--tin:#07130d;
--ring:#34c38f66;--tint:#34c38f2e;--ongold:#04150d;--navbg:#0a1a12f2;--dlg:#0a1a12;--mapf:invert(.92) hue-rotate(180deg) saturate(.7)}
[data-theme=paper]{--bg:#fbf5e6;--card:#fffaf0;--ink:#2b2417;--mut:#6b604a;--gold:#b7791f;--gold2:#8a5a0b;--glow:#b7791f33;--hero:#e9c46a40;
--surf:#fff3d6;--surf2:#fffdf6;--line:#e4d6b0;--line2:#d9c690;--ga:#fffdf7;--gb:#fbf1d8;--tia:#fffaf0;--tib:#f6e9c6;--tin:#fffaf0;
--ring:#b7791f66;--tint:#b7791f22;--ongold:#fff8e6;--navbg:#fffaf0f2;--dlg:#fffaf0;--mapf:none}
[data-theme=sapphire]{--bg:#060a14;--card:#0d1424;--ink:#e8eefc;--mut:#93a0bf;--gold:#5b9dff;--gold2:#a9ccff;--glow:#5b9dff40;--hero:#5b9dff26;
--surf:#101a30;--surf2:#0b1224;--line:#1e2c4d;--line2:#2a3b66;--ga:#0f1930;--gb:#070d1b;--tia:#121d36;--tib:#070c19;--tin:#070c19;
--ring:#5b9dff66;--tint:#5b9dff2e;--ongold:#04101f;--navbg:#0a1222f2;--dlg:#0a1222;--mapf:invert(.92) hue-rotate(180deg) saturate(.7)}
[data-theme=sepia]{--bg:#17110b;--card:#211810;--ink:#f3e6d3;--mut:#b3a187;--gold:#d08a4e;--gold2:#f0c08a;--glow:#d08a4e40;--hero:#d08a4e26;
--surf:#261b11;--surf2:#1f160e;--line:#3a2a1b;--line2:#4d3822;--ga:#241a10;--gb:#150f09;--tia:#2a1d12;--tib:#140e08;--tin:#140e08;
--ring:#d08a4e66;--tint:#d08a4e2e;--ongold:#1c1005;--navbg:#1b130cf2;--dlg:#1b130c;--mapf:invert(.9) hue-rotate(180deg) saturate(.6)}

:root{--font:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;padding-bottom:120px;
background-image:radial-gradient(circle at 85% -5%,var(--hero),transparent 45%);background-attachment:fixed;transition:background-color .3s,color .3s}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.wrap{max-width:960px;margin:auto;padding:0 18px}

/* ===== ২. টপ বার ===== */
.top{display:flex;align-items:center;gap:12px;padding:18px 0 8px}
.logo{width:52px;height:52px;border-radius:16px;border:2px solid var(--gold);display:grid;place-items:center;background:var(--surf);box-shadow:0 0 14px var(--glow)}
.top h1{font-size:1.55rem;line-height:1.1;margin-right:auto}
.top h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--mut)}
.ibtn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;cursor:pointer}
svg{fill:none;stroke:var(--gold2);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ===== ৩. আজকের কার্ড ===== */
.hello{margin:10px 0 14px}
.hello p{color:var(--mut)}
.hello h2{font-size:1.35rem;font-weight:600}
.hello .dt{font-size:.9rem;color:var(--mut);margin-top:2px}
.card{border:1.5px solid var(--gold);border-radius:24px;background:linear-gradient(180deg,var(--ga),var(--gb));padding:16px;box-shadow:0 0 22px var(--glow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.row span{color:var(--mut);font-size:.9rem}
.clk{font-size:1.5rem;font-weight:600;color:var(--gold2);border:1px solid var(--ring);border-radius:14px;padding:2px 14px;background:var(--tint)}
.qt{font-size:1.12rem;line-height:1.7}
.qt cite{display:block;margin-top:6px;color:var(--gold);font-size:.88rem;font-style:normal}

/* ===== ৪. সার্চ ও সেকশন হেডিং ===== */
#q{width:100%;margin:18px 0 4px;padding:13px 18px;border-radius:16px;border:1px solid var(--line2);background:var(--surf2);color:var(--ink);font:inherit}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 14px}
.sh h2{font-size:1.45rem;font-weight:600}
.sh span{color:var(--mut)}
.sh a{color:var(--gold2);font-size:.9rem;cursor:pointer}

/* ===== ৫. আইকন টাইল ===== */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 12px}
@media(min-width:760px){.sg{grid-template-columns:repeat(6,1fr);gap:24px 18px}}
.svc{background:none;border:0;color:var(--ink);font:inherit;text-align:center;cursor:pointer;padding:0}
.tile{display:grid;place-items:center;aspect-ratio:1;border-radius:26px;border:2px solid var(--gold);
background:linear-gradient(160deg,var(--tia),var(--tib));
box-shadow:0 0 16px var(--glow),inset 0 0 0 5px var(--tin),inset 0 0 0 6.5px var(--ring);transition:box-shadow .2s,transform .2s}
.svc:hover .tile{box-shadow:0 0 28px var(--glow),inset 0 0 0 5px var(--tin),inset 0 0 0 6.5px var(--gold);transform:translateY(-2px)}
.tile svg{width:40%;height:40%}
.svc b{display:block;margin-top:9px;font-size:.95rem;font-weight:500;line-height:1.3}
.svc small{display:block;color:var(--mut);font-size:.76rem}

/* ===== ৬. ভেতরের পাতা, কোটেশন, ম্যাপ, কুইজ ===== */
.ph{display:flex;align-items:center;gap:14px;margin:18px 0}
.ph .tile{width:72px;flex:none}
.ph h2{font-size:1.7rem;line-height:1.2}.ph small{color:var(--mut)}
.quote{position:relative;border:1.5px solid var(--gold);border-radius:22px;padding:18px 18px 16px 52px;background:var(--surf2);box-shadow:0 0 18px var(--glow);margin-bottom:6px}
.quote::before{content:"“";position:absolute;left:14px;top:-2px;font-size:4rem;color:var(--gold);line-height:1}
.back{color:var(--gold2);cursor:pointer;background:none;border:0;font:inherit;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--ring);background:var(--surf2);color:var(--ink);padding:6px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on,.chip.ok{background:var(--gold);color:var(--ongold);border-color:var(--gold)}.chip.no{background:#a93a32;color:#fff;border-color:#a93a32}
iframe{width:100%;height:min(58vh,440px);border:2px solid var(--gold);border-radius:22px;box-shadow:0 0 18px var(--glow);filter:var(--mapf)}
.q{border:1px solid var(--line2);border-radius:18px;padding:14px;margin-bottom:12px;background:var(--card)}
.q div{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.moreq{margin-top:12px}
.moreq .quote{margin-top:12px}

/* ===== ৭. পপআপ ও থিম বাছাই ===== */
dialog{background:var(--dlg);color:var(--ink);border:2px solid var(--gold);border-radius:26px;width:calc(100% - 32px);max-width:420px;padding:22px;margin:auto;box-shadow:0 0 40px var(--glow)}
dialog::backdrop{background:#000c}
dialog .tile{width:84px;margin:0 auto 12px}
dialog h3{text-align:center}dialog p{color:var(--mut);margin:10px 0;text-align:center}
dialog ul{margin:10px 0 10px 20px}dialog a{color:var(--gold2)}
.cl{display:block;margin:14px auto 0}
.thl{display:grid;gap:10px;margin-top:14px}
.th{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border-radius:16px;border:1px solid var(--line2);background:var(--surf2);color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.th.on{border-color:var(--gold);background:var(--tint)}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid;flex:none}

/* ===== ৮. নিচের নেভিগেশন ===== */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:520px;
display:flex;justify-content:space-around;background:var(--navbg);border:1px solid var(--line2);border-radius:28px;padding:8px 6px;backdrop-filter:blur(8px);z-index:10}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:.78rem;display:grid;justify-items:center;gap:2px;padding:6px 12px;border-radius:20px;cursor:pointer}
nav button svg{width:24px;height:24px;stroke:currentColor}
nav button.on{background:var(--tint);color:var(--gold2)}
.empty{color:var(--mut);padding:24px 0;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav" aria-label="প্রধান মেনু"></nav>
<dialog id="m"></dialog>

<script>

   ===================================================================== */

const svg=n=>`<svg viewBox="0 0 24 24"><path d="${I[n]}"/></svg>`;

/* =====================================================================
   ২. থিম তালিকা: [id, নাম, ব্যাকগ্রাউন্ড রং, অ্যাকসেন্ট রং]
   ===================================================================== */
const TH=[
 ['gold','সোনালি রাত','#0b0b0a','#d4a22a'],
 ['emerald','ইসলামিক সবুজ','#06130e','#34c38f'],
 ['paper','দিনের আলো','#fbf5e6','#b7791f'],
 ['sapphire','নীল আকাশ','#060a14','#5b9dff'],
 ['sepia','লাইব্রেরি সেপিয়া','#17110b','#d08a4e']
];
function applyTheme(id){
  const t=TH.find(x=>x[0]===id)||TH[0];
  document.documentElement.dataset.theme=t[0];
  document.querySelector('meta[name=theme-color]').content=t[2];
  try{localStorage.setItem('iz-theme',t[0])}catch(e){}
}
let savedTheme='gold';try{savedTheme=localStorage.getItem('iz-theme')||'gold'}catch(e){}
applyTheme(savedTheme);

/* =====================================================================
   ৩. মূল ডেটা – পুরো সাইটের কন্টেন্ট এখানে

   নতুন বিভাগ যোগ করলে নিচের GROUPS-এও id বসান।
   ===================================================================== */

 {q:'সূর্য কী?',o:['গ্রহ','তারা','উপগ্রহ','ধূমকেতু'],a:1},
 {q:'পানির রাসায়নিক সংকেত কোনটি?',o:['CO₂','H₂O','O₂','NaCl'],a:1},
 {q:'বিশ্বের সবচেয়ে বড় মহাদেশ কোনটি?',o:['আফ্রিকা','ইউরোপ','এশিয়া','উত্তর আমেরিকা'],a:2},
 {q:'রমজান হিজরি সনের কততম মাস?',o:['৭ম','৮ম','৯ম','১০ম'],a:2},
 {q:'বাংলাদেশের জাতীয় কবি কে?',o:['রবীন্দ্রনাথ ঠাকুর','কাজী নজরুল ইসলাম','জসীমউদ্দীন','জীবনানন্দ দাশ'],a:1},
 {q:'সূরা ফাতিহার আয়াত সংখ্যা কত?',o:['৫','৭','৯','১১'],a:1},
 {q:'বাংলাদেশের জাতীয় পশু কোনটি?',o:['হরিণ','রয়েল বেঙ্গল টাইগার','হাতি','ভালুক'],a:1}];

/* ম্যাপ অঞ্চল: [নাম, bbox = পশ্চিম,দক্ষিণ,পূর্ব,উত্তর] */
const REG=[['বাংলাদেশ','88.0,20.5,92.7,26.7'],['ঢাকা','89.6,23.2,91.0,24.6'],['চট্টগ্রাম','90.9,21.2,92.4,23.4'],['রাজশাহী','88.0,24.0,89.6,25.5'],['খুলনা','88.8,21.7,90.0,23.4'],['বরিশাল','89.9,21.8,91.0,23.1'],['সিলেট','91.2,24.0,92.4,25.2'],['রংপুর','88.4,25.0,89.8,26.7'],['ময়মনসিংহ','89.8,24.2,91.0,25.4'],['বিশ্ব','-170,-55,180,75']];
const mapSrc=b=>`https://www.openstreetmap.org/export/embed.html?bbox=${b}&layer=mapnik`;

/* =====================================================================
   ৩. রেন্ডার লজিক
   ===================================================================== */
const $=s=>document.querySelector(s),app=$('#app'),byId=id=>C.find(c=>c.id===id);
const tile=(ic,bn,en,attr)=>`<button class="svc" ${attr}><span class="tile">${svg(ic)}</span><b>${bn}</b><small>${en}</small></button>`;
const catTile=c=>tile(c.ic,c.bn,c.en,`data-go="${c.id}"`);
const topTile=(c,i)=>{const t=c.t[i];return tile(t[2],t[0],t[1],`data-t="${c.id},${i}"`)};
const sh=(a,b,link)=>`<div class="sh"><h2>${a}</h2>${link?`<a data-go="${link}">সব দেখুন</a>`:`<span>${b}</span>`}</div>`;
const quoteBox=x=>`<div class="quote"><p class="qt">${x[0]}<cite>— ${x[1]}</cite></p></div>`;

function groupsHTML(){
  return GROUPS.map(g=>sh(g[0],g[1],g[3]?g[2][0]:'')+`<div class="sg">`+
   g[2].map(id=>{const c=byId(id);return g[3]?c.t.map((_,i)=>topTile(c,i)).join(''):catTile(c)}).join('')+`</div>`).join('');
}

function home(){
  const day=new Date().getDate(),dq=C[day%C.length].q;
  app.innerHTML=`<header class="top"><span class="logo">${svg('quran').replace('<svg','<svg width="28" height="28"')}</span>
   <h1>IqraZone<small>জ্ঞানের আলোয় আলোকিত জীবন</small></h1>
   <button class="ibtn" data-themes aria-label="থিম বদলান">${svg('palette')}</button></header>
   <div class="hello"><p>আসসালামু আলাইকুম</p><h2 id="dt"></h2><div class="dt" id="hj"></div></div>
   <div class="card"><div class="row"><span>আজকের অনুপ্রেরণা</span><div class="clk" id="clk"></div></div>
   <p class="qt">${dq[0]}<cite>— ${dq[1]}</cite></p></div>
   <input id="q" type="search" placeholder="খুঁজুন: কুরআন, বিসিএস, ব্যাকরণ…" aria-label="সার্চ">
   <div id="res">${groupsHTML()}</div>`;
  $('#q').oninput=e=>{
    const f=e.target.value.trim().toLowerCase();if(!f){$('#res').innerHTML=groupsHTML();return}
    let h='';C.forEach(c=>{
      if((c.bn+c.en).toLowerCase().includes(f))h+=catTile(c);
      c.t.forEach((t,i)=>{if((t[0]+t[1]).toLowerCase().includes(f))h+=topTile(c,i)})});
    $('#res').innerHTML=h?`<div class="sg" style="margin-top:20px">${h}</div>`:'<p class="empty">কিছু পাওয়া যায়নি। অন্য শব্দ দিয়ে খুঁজুন।</p>'};
  tick();
}

function page(c){
  let x='';
  if(c.s==='map')x=sh('ইন্টারেক্টিভ ম্যাপ','Map')+`<div class="chips">${REG.map((r,i)=>`<button class="chip ${i?'':'on'}" data-b="${r[1]}">${r[0]}</button>`).join('')}</div><iframe id="mf" title="ম্যাপ" loading="lazy" src="${mapSrc(REG[0][1])}"></iframe>`;
  if(c.s==='quiz')x=sh('দ্রুত কুইজ','Quick Quiz')+QUIZ.map((z,i)=>`<div class="q"><b>${z.q}</b><div>${z.o.map((o,j)=>`<button class="chip" data-q="${i}" data-j="${j}">${o}</button>`).join('')}</div></div>`).join('');
  const more=c.m&&c.m.length?`<div class="moreq"><button class="chip" id="mb">আরও কোটেশন দেখুন (${c.m.length})</button><div id="mq" hidden>${c.m.map(quoteBox).join('')}</div></div>`:'';
  app.innerHTML=`<button class="back" data-go="">← হোম</button>
   <div class="ph"><span class="tile">${svg(c.ic)}</span><div><h2>${c.bn}</h2><small>${c.en}</small></div></div>
   ${quoteBox(c.q)}${more}
   ${sh('সব টপিক','Topics')}<div class="sg">${c.t.map((_,i)=>topTile(c,i)).join('')}</div>${x}`;
  const mb=$('#mb');if(mb)mb.onclick=()=>{const q=$('#mq');q.hidden=!q.hidden;mb.textContent=q.hidden?`আরও কোটেশন দেখুন (${c.m.length})`:'কম দেখুন'};
  app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-b]').forEach(y=>y.classList.remove('on'));b.classList.add('on');$('#mf').src=mapSrc(b.dataset.b)});
  app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    const z=QUIZ[b.dataset.q],p=b.parentElement;p.querySelectorAll('.chip').forEach(y=>y.classList.remove('ok','no'));
    const ok=+b.dataset.j===z.a;b.classList.add(ok?'ok':'no');if(!ok)p.children[z.a].classList.add('ok')});
}

// টপিকের পপআপ: links থাকলে দেখাবে, না থাকলে "শীঘ্রই আসছে"
function openTopic(id,i){
  const c=byId(id),t=c.t[i],m=$('#m');
  m.innerHTML=`<span class="tile">${svg(t[2])}</span><h3>${t[0]}</h3><p>${t[1]} · ${c.bn}</p>
  ${t[3]?`<ul>${t[3].map(l=>`<li><a href="${l.u}" target="_blank" rel="noopener">${l.t}</a></li>`).join('')}</ul>`:'<p>এই টপিকের নোট শীঘ্রই যোগ হবে।</p>'}
  <p class="qt" style="font-size:.95rem">${c.q[0]}</p><button class="chip on cl" onclick="$('#m').close()">বন্ধ করুন</button>`;
  m.showModal();
}

// থিম বাছাইয়ের পপআপ
function openThemes(){
  const cur=document.documentElement.dataset.theme,m=$('#m');
  m.innerHTML=`<h3>থিম বেছে নিন</h3><p>আপনার পছন্দের রং নির্বাচন করুন</p>
  <div class="thl">${TH.map(t=>`<button class="th ${t[0]===cur?'on':''}" data-th="${t[0]}"><span class="sw" style="background:${t[2]};border-color:${t[3]};box-shadow:inset 0 0 0 6px ${t[2]},inset 0 0 0 20px ${t[3]}"></span>${t[1]}</button>`).join('')}</div>
  <button class="chip on cl" onclick="$('#m').close()">বন্ধ করুন</button>`;
  m.showModal();
}

// নিচের নেভিগেশন
const NAV=[['home','হোম',''],['mosque','ইসলাম','islam'],['globe','GK','gk'],['map','ম্যাপ','map'],['bag','চাকরি','job']];
function nav(){$('#nav').innerHTML=NAV.map(n=>`<button data-go="${n[2]}" class="${location.hash==='#'+n[2]||(!n[2]&&!location.hash)?'on':''}">${svg(n[0])}${n[1]}</button>`).join('')}

// তারিখ ও ঘড়ি (বাংলা সংখ্যায়)
function tick(){
  const d=new Date(),c=$('#clk');if(!c)return;
  c.textContent=d.toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit',second:'2-digit'});
  $('#dt').textContent=d.toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  try{$('#hj').textContent=new Intl.DateTimeFormat('bn-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(d)+' হিজরি'}catch(e){}
}
setInterval(tick,1000);

// ক্লিক হ্যান্ডলার ও রাউটার
document.addEventListener('click',e=>{
  const th=e.target.closest('[data-th]');
  if(th){applyTheme(th.dataset.th);openThemes();return}
  if(e.target.closest('[data-themes]')){openThemes();return}
  const g=e.target.closest('[data-go]'),t=e.target.closest('[data-t]');
  if(g)location.hash=g.dataset.go;
  if(t){const[a,b]=t.dataset.t.split(',');openTopic(a,+b)}
});
function route(){const c=C.find(x=>'#'+x.id===location.hash);c?page(c):home();nav();scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
